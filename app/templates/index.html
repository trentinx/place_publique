<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHM YouTube Live Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        select {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            background: white;
            color: #333;
            transition: all 0.3s ease;
        }

        select:hover {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .aquarium-frame {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(to bottom, #87ceeb, #e0f6ff);
            border: 20px solid #8b7355;
            border-radius: 50px;
            box-shadow:
                inset 0 0 50px rgba(0, 0, 0, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.4),
                inset -2px -2px 10px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(135, 206, 250, 0.5)),
                radial-gradient(circle at 80% 50%, rgba(255, 218, 185, 0.3));
        }

        .timestamp {
            color: #fff;
            font-size: 1.2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .main-image-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 5px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .placeholder {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.5em;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .carousel-container {
            width: 100%;
            margin-top: 30px;
        }

        .carousel-title {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-align: center;
        }

        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
            scroll-behavior: smooth;
        }

        .carousel::-webkit-scrollbar {
            height: 8px;
        }

        .carousel::-webkit-scrollbar-track {
            background: #e0e0e0;
            border-radius: 10px;
        }

        .carousel::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .carousel::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .thumbnail {
            flex: 0 0 100px;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 3px solid transparent;
        }

        .thumbnail:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
            border-color: #667eea;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1em;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 15px;
            }

            .controls {
                flex-direction: column;
            }

            select {
                width: 100%;
            }

            .aquarium-frame {
                border-width: 15px;
            }

            .thumbnail {
                flex: 0 0 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YouTube Live Viewer</h1>

        <div class="info-box">
            <p>Sélectionnez un canal pour afficher les images les plus récentes</p>
        </div>

        <div class="controls">
            <select id="channelSelect" onchange="changeChannel()">
                <option value="">-- Sélectionnez un canal --</option>
            </select>
        </div>

        <div class="main-content">
            <div class="aquarium-frame">
                <div class="timestamp" id="timestamp">--:--:--</div>
                <div class="main-image-container">
                    <div id="mainImage" class="placeholder">Aucune image disponible</div>
                </div>
            </div>

            <div class="carousel-container">
                <div class="carousel-title">Images récentes</div>
                <div class="carousel" id="carousel"></div>
            </div>

            <div class="loading" id="loading">⏳ Chargement...</div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8082/api';
        const mainImageContainer = document.getElementById('mainImage');
        const timestampEl = document.getElementById('timestamp');
        const carouselEl = document.getElementById('carousel');
        const channelSelect = document.getElementById('channelSelect');
        const loadingEl = document.getElementById('loading');

        let currentChannel = null;

        async function loadChannels() {
            try {
                const response = await fetch(`${API_BASE_URL}/channels`);
                const data = await response.json();

                if (data.channels && data.channels.length > 0) {
                    channelSelect.innerHTML = '<option value="">-- Sélectionnez un canal --</option>';
                    data.channels.forEach(channel => {
                        const option = document.createElement('option');
                        option.value = channel;
                        option.textContent = channel;
                        channelSelect.appendChild(option);
                    });

                    // Auto-select first channel if only one exists
                    if (data.channels.length === 1) {
                        channelSelect.value = data.channels[0];
                        await changeChannel();
                    }
                }
            } catch (error) {
                console.error('Error loading channels:', error);
            }
        }

        async function changeChannel() {
            const channel = channelSelect.value;
            if (!channel) {
                mainImageContainer.innerHTML = '<div class="placeholder">Sélectionnez un canal</div>';
                carouselEl.innerHTML = '';
                return;
            }

            currentChannel = channel;
            await loadImages(channel);
        }

        async function loadImages(channel) {
            loadingEl.classList.add('active');
            try {
                const response = await fetch(`${API_BASE_URL}/images/${channel}?limit=10`);
                if (!response.ok) throw new Error('Failed to load images');

                const data = await response.json();

                if (data.images && data.images.length > 0) {
                    // Display the first (most recent) image as main
                    const mainImage = data.images[0];
                    displayMainImage(mainImage);

                    // Display thumbnails
                    displayCarousel(data.images);
                } else {
                    mainImageContainer.innerHTML = '<div class="placeholder">Aucune image disponible</div>';
                    carouselEl.innerHTML = '';
                }
            } catch (error) {
                console.error('Error loading images:', error);
                mainImageContainer.innerHTML = '<div class="placeholder">Erreur lors du chargement</div>';
            } finally {
                loadingEl.classList.remove('active');
            }
        }

        function displayMainImage(image) {
            const timestamp = new Date(image.timestamp);
            timestampEl.textContent = timestamp.toLocaleString('fr-FR');

            const img = document.createElement('img');
            img.src = image.url;
            img.className = 'main-image';
            img.alt = 'Main image';

            mainImageContainer.innerHTML = '';
            mainImageContainer.appendChild(img);
        }

        function displayCarousel(images) {
            carouselEl.innerHTML = '';

            images.forEach((image, index) => {
                const thumbnail = document.createElement('div');
                thumbnail.className = 'thumbnail';

                const img = document.createElement('img');
                img.src = image.url;
                img.alt = `Thumbnail ${index + 1}`;

                thumbnail.appendChild(img);
                thumbnail.onclick = () => displayMainImage(image);

                carouselEl.appendChild(thumbnail);
            });
        }

        // Load channels on page load
        window.addEventListener('load', loadChannels);

        // Auto-refresh every 30 seconds
        setInterval(() => {
            if (currentChannel) {
                loadImages(currentChannel);
            }
        }, {{ interval }});
    </script>
</body>
</html>
